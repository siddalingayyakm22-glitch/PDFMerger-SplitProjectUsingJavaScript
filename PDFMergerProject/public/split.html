<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Split PDF - PDF Tools</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body>

<nav class="navbar navbar-expand-lg bg-dark navbar-dark">

    <div class="container">

        <a class="navbar-brand" href="/">
            PDF Tools
        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>


        <div
            class="collapse navbar-collapse"
            id="navbarNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="/">
                        Home
                    </a>

                </li>

                <li class="nav-item">

                    <a
                        class="nav-link active"
                        href="/split.html">
                        Split PDF
                    </a>

                </li>

            </ul>

        </div>

    </div>

</nav>


<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow p-4">

                <h1 class="text-center mb-3">
                    ✂️ Split PDF
                </h1>

                <p class="text-center text-muted">

                    Extract specific pages from your PDF.

                </p>


                <form id="splitForm">


                    <div class="mb-3">

                        <label
                            for="pdfFile"
                            class="form-label">

                            Select PDF

                        </label>


                        <input
                            type="file"
                            class="form-control"
                            id="pdfFile"
                            accept=".pdf"
                            required>

                    </div>


                    <div class="mb-3">

                        <label
                            for="pages"
                            class="form-label">

                            Pages to extract

                        </label>


                        <input
                            type="text"
                            class="form-control"
                            id="pages"
                            placeholder="Example: 1-3"
                            required>


                        <div class="form-text">

                            Example:
                            <strong>1-3</strong>
                            extracts pages 1, 2 and 3.

                        </div>

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary w-100">

                        Split PDF

                    </button>


                </form>


                <div
                    id="status"
                    class="alert mt-4"
                    style="display:none;">

                </div>


                <a
                    id="downloadBtn"
                    class="btn btn-success w-100"
                    style="display:none;">

                    Download Split PDF

                </a>

            </div>

        </div>

    </div>

</div>



<script>

const splitForm =
    document.getElementById("splitForm");


splitForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const file =
            document.getElementById("pdfFile")
            .files[0];


        const pages =
            document.getElementById("pages")
            .value.trim();


        const status =
            document.getElementById("status");


        const downloadBtn =
            document.getElementById("downloadBtn");


        const formData =
            new FormData();


        formData.append(
            "pdf",
            file
        );


        formData.append(
            "pages",
            pages
        );


        status.style.display = "block";

        status.className =
            "alert alert-info mt-4";

        status.textContent =
            "Splitting PDF...";


        downloadBtn.style.display =
            "none";


        try {

            const response =
                await fetch(
                    "/split",
                    {
                        method: "POST",
                        body: formData
                    }
                );


            const result =
                await response.json();


            if (result.success) {

                status.className =
                    "alert alert-success mt-4";

                status.textContent =
                    "PDF split successfully!";


                downloadBtn.href =
                    result.downloadUrl;


                downloadBtn.style.display =
                    "block";

            } else {

                status.className =
                    "alert alert-danger mt-4";

                status.textContent =
                    result.error;

            }

        } catch (error) {

            status.className =
                "alert alert-danger mt-4";

            status.textContent =
                "Something went wrong.";

        }

    }

);

</script>


</body>

</html>
